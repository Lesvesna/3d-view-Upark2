<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<title>3D Viewer</title>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>


<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

canvas{
display:block;
}

#loading{
position:absolute;
top:50%;
width:100%;
text-align:center;
font-family:Arial;
font-size:20px;
}

</style>

</head>


<body>


<div id="loading">
Загрузка...
</div>



<script type="module">


import * as THREE from "three";


import {GLTFLoader}
from
"three/addons/loaders/GLTFLoader.js";


import {OrbitControls}
from
"three/addons/controls/OrbitControls.js";





const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0xffffff);





const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
100000
);





const renderer =
new THREE.WebGLRenderer({
antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.setPixelRatio(
window.devicePixelRatio
);


document.body.appendChild(
renderer.domElement
);





// свет

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x555555,
5
)
);


const light =
new THREE.DirectionalLight(
0xffffff,
5
);


light.position.set(
100,
200,
100
);


scene.add(light);





// камера

const controls =
new OrbitControls(
camera,
renderer.domElement
);


controls.enableDamping = true;

controls.dampingFactor = 0.05;


controls.enablePan = false;


controls.enableZoom = true;





const loader =
new GLTFLoader();





loader.load(

"models/grass.glb",


(gltf)=>{


const model =
gltf.scene;


scene.add(model);




// ======================
// ПОВОРОТ CAD
// ======================

model.rotation.x =
-Math.PI / 2;




// ======================
// НАСТОЯЩИЙ ЦЕНТР
// ======================


const box =
new THREE.Box3()
.setFromObject(model);



const center =
box.getCenter(
new THREE.Vector3()
);


const size =
box.getSize(
new THREE.Vector3()
);



// переносим модель в 0

model.position.x -= center.x;

model.position.y -= center.y;

model.position.z -= center.z;





// масштаб

const maxSize =
Math.max(
size.x,
size.y,
size.z
);


const scale =
500 / maxSize;


model.scale.setScalar(scale);




// пересчёт после масштаба

const newBox =
new THREE.Box3()
.setFromObject(model);



const newCenter =
newBox.getCenter(
new THREE.Vector3()
);



// центр вращения камеры

controls.target.copy(
newCenter
);




// камера спереди

const distance =
Math.max(
size.x,
size.y,
size.z
) * 0.8;



camera.position.set(
0,
0,
distance
);


camera.lookAt(
newCenter
);



controls.update();



document
.getElementById("loading")
.remove();



console.log("Готово");



},



undefined,



(error)=>{

console.error(error);

}

);





function animate(){

requestAnimationFrame(
animate
);


controls.update();


renderer.render(
scene,
camera
);


}


animate();





window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);


});



</script>


</body>

</html>
